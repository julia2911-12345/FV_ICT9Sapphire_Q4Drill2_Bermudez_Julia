<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q4 Drill 2</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    body{
        background-image: url('https://i.pinimg.com/736x/0b/27/9e/0b279eb3e5b5babc67ad7b5764ec71e0.jpg');
        background-size: cover;
        background-repeat: no-repeat;
       }
    .card{
	background-color: rgba(255, 255, 255, 0.9);
	border-radius: 15px;
	}

	h1{
		color: #b30000;
	}

	.btn-primary{
		background-color: #ff5733;
		border: none;
	}

	.btn-primary:hover{
		background-color: #e64a19;
	}

	label{
		font-weight: 500;
	}
	</style>

</head>

<body>

<div class="container mt-5">

	<div class="card p-4 shadow-sm">

		<h1 class="text-center mb-3">Heat Index Checker</h1>


		<details ontoggle="showMsg()" class="mb-3">
			<summary class="fw-bold">Show Instructions</summary>
			<p id="instruct" class="mt-2 text-center"></p>
		</details>


		<div class="mb-3">
			<label class="form-label">Temperature (°C):</label>
			<input type="number" id="temp" class="form-control">
		</div>

		<div class="mb-3">
			<label class="form-label">Humidity (%):</label>
			<input type="number" id="humid" class="form-control">
		</div>

		<!-- Button -->
		<div class="text-center">
			<button onclick="CheckHI()" class="btn btn-primary px-4">
				Check
			</button>
		</div>

	</div>

</div>

<script>

	document.getElementById('instruct').innerHTML =
	"Enter temperature (°C) and humidity (%), then click compute.";

	function showMsg(){
		console.log("Instructions toggled");
	}

	function CheckHI(){

		var temp = Number(document.getElementById("temp").value);
		var humid = Number(document.getElementById("humid").value);

		var heatindex = temp + (0.33 * humid) - 4;

		heatindex = heatindex.toFixed(1);

		var message = "";

		switch (true){
			case (heatindex <= 27):
				message = "Comfortable / Cool";
				break;
			case (heatindex <= 32):
				message = "Warm";
				break;
			case (heatindex <= 37):
				message = "Hot";
				break;
			case (heatindex <= 41):
				message = "Very Hot / Caution";
				break;
			case (heatindex >= 42):
				message = "Extreme Heat / Danger";
				break;
			default:
				message = "Heat Index cannot be determined.";
		}

		alert("Heat Index: " + heatindex + "°C\nStatus: " + message);
	}
</script>

</body>
</html>
